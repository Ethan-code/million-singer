<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>百萬大歌星 (讀取外部 JSON 版)</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;"
    />

    <style>
      /* --- 全局設定 --- */
      :root {
        --c-gold: #ffcc00;
        --c-bg: #000;
        --c-panel: #222;
        --c-text: #fff;
        --c-border: #444;
        --c-danger: #c00;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--c-bg);
        color: var(--c-text);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        position: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .hidden {
        display: none !important;
      }

      /* --- 面板 --- */
      .panel {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .panel__title {
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 900;
        color: var(--c-gold);
        margin: 0 0 20px 0;
      }

      .btn {
        padding: 12px 24px;
        border-radius: 50px;
        font-weight: bold;
        cursor: pointer;
        border: 1px solid var(--c-border);
        background: var(--c-panel);
        color: #aaa;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }
      .btn:hover {
        background: #444;
        color: #fff;
        transform: translateY(-2px);
      }
      .btn--primary {
        background: var(--c-gold);
        color: black;
        border: none;
        box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
      }
      .btn--disabled {
        opacity: 0.3;
        pointer-events: none;
        filter: grayscale(1);
      }
      .btn--icon {
        width: 48px;
        padding: 0;
      }

      /* --- 遊戲畫面 --- */
      .game {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* Header */
      .header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 40px;
        z-index: 50;
        pointer-events: none;
      }
      .header__round {
        font-size: 1.5rem;
        color: var(--c-gold);
        border: 2px solid var(--c-gold);
        padding: 5px 20px;
        border-radius: 50px;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.5);
        pointer-events: auto;
      }
      .header__status {
        font-size: 1.2rem;
        color: #888;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* Title & Lyrics */
      /* 2. 歌曲標題 - 往上移，稍微變小，作為輔助資訊 */
      .title-display {
        position: absolute;
        top: 5%; /* 從 10% 改為 5%，拉高 */
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 3vh; /* 字體稍微縮小 (原本 4vh)，讓主角讓給歌詞 */
        font-weight: bold;
        letter-spacing: 2px;
        z-index: 20; /* 降低層級，讓它在歌詞"下面" (如果字真的大到重疊，歌詞會蓋過標題) */
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        display: none;
        color: #888; /* 顏色調暗，不要太搶眼 */
        pointer-events: none;
      }
      .title-display.visible {
        display: block;
        animation: fadeIn 0.5s;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 1. 歌詞區域 - 核心修改：改為全螢幕填滿，絕對置中 */
      .lyrics-area {
        position: absolute;
        inset: 0; /* 等同於 top:0; bottom:0; left:0; right:0; 填滿整個視窗 */
        display: flex;
        flex-direction: column;
        justify-content: center; /* 垂直置中 */
        align-items: center; /* 水平置中 */
        z-index: 30;
        /* 允許文字超出容器 (針對超長歌詞) */
        overflow: visible;
      }

      /* 歌詞文字 (維持超大字體，稍微加強陰影區隔背景) */
      .lyric-line {
        font-size: 20vmin;
        font-weight: 900;
        line-height: 1;
        color: white;
        text-shadow: 0 0 60px rgba(255, 204, 0, 0.8); /* 陰影加重，避免跟標題混在一起 */
        white-space: pre-wrap;
        word-break: break-word;
        padding: 0 20px;
        text-align: center;
        width: 100%;
      }
      @media (min-width: 1024px) {
        .lyric-line {
          font-size: 32vh;
        }
      }

      .magic-word {
        display: inline-block;
        color: var(--c-gold);
        text-shadow: 0 0 40px rgba(255, 204, 0, 0.8);
        margin: 0 5px;
        letter-spacing: 0px;
        border-bottom: 0.1em solid var(--c-gold);
        padding-bottom: 10px;
        vertical-align: baseline;
      }
      .magic-word.is-revealing {
        animation: popText 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      @keyframes popText {
        0% {
          transform: scale(1);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.3);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Visualizer & Controls */
      .visualizer {
        position: absolute;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 15px;
        align-items: flex-end;
        height: 100px;
        opacity: 0.1;
        transition: opacity 0.5s;
        z-index: 10;
        pointer-events: none;
      }
      .visualizer.active {
        opacity: 0.8;
      }
      .visualizer__bar {
        width: 20px;
        background: var(--c-gold);
        border-radius: 4px;
        box-shadow: 0 0 20px var(--c-gold);
        transform-origin: bottom;
      }
      .visualizer.playing .visualizer__bar {
        animation: bounce 1s infinite ease-in-out;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: scaleY(0.3);
          opacity: 0.5;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      .controls {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 40;
        padding: 20px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .controls:hover,
      .controls:active {
        opacity: 1;
      }
      .menu {
        position: absolute;
        top: 75px;
        left: 30px;
        background: rgba(34, 34, 34, 0.98);
        border: 2px solid var(--c-gold);
        border-radius: 8px;
        max-height: 50vh;
        overflow-y: auto;
        z-index: 101;
        display: none;
        min-width: 200px;
      }
      .menu.visible {
        display: block;
      }
      .menu__item {
        padding: 12px 20px;
        cursor: pointer;
        border-bottom: 1px solid #444;
        color: #ccc;
      }
      .menu__item:hover,
      .menu__item.active {
        background: var(--c-gold);
        color: black;
        font-weight: bold;
      }

      /* 載入錯誤提示 */
      .error-msg {
        color: #f55;
        margin-top: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <audio id="audioPlayer" preload="auto" style="display: none"></audio>

    <section id="screen-start" class="panel">
      <h1 class="panel__title">🎤 百萬大歌星</h1>
      <p style="color: #aaa; margin-bottom: 10px">讀取外部 playlist.json</p>
      <p id="load-status" style="color: #888; margin-bottom: 30px">
        正在讀取檔案...
      </p>

      <div style="display: flex; gap: 10px">
        <button
          id="btn-start-game"
          class="btn btn--primary btn--disabled"
          style="font-size: 1.5rem"
        >
          開始遊戲
        </button>
        <button id="btn-reload" class="btn">🔄 重新讀取 JSON</button>
      </div>
    </section>

    <div id="screen-game" class="game hidden">
      <header class="header">
        <div id="display-round" class="header__round">ROUND 1</div>
        <div id="display-status" class="header__status">Ready</div>
      </header>

      <aside id="menu-container" class="menu"></aside>
      <div id="display-title" class="title-display"></div>

      <div id="visualizer" class="visualizer">
        <div
          class="visualizer__bar"
          style="height: 30px; animation-duration: 0.8s"
        ></div>
        <div
          class="visualizer__bar"
          style="height: 50px; animation-duration: 1.2s"
        ></div>
        <div
          class="visualizer__bar"
          style="height: 70px; animation-duration: 0.5s"
        ></div>
        <div
          class="visualizer__bar"
          style="height: 40px; animation-duration: 1s"
        ></div>
        <div
          class="visualizer__bar"
          style="height: 30px; animation-duration: 0.7s"
        ></div>
      </div>

      <div class="lyrics-area">
        <div
          id="idle-msg"
          style="display: flex; flex-direction: column; align-items: center"
        >
          <p
            id="idle-round-text"
            style="
              color: var(--c-gold);
              font-size: 5vh;
              font-weight: bold;
              margin-bottom: 10px;
            "
          ></p>
          <span style="color: #888; font-size: 3vh"
            >Space: 播放 / Enter: 揭曉</span
          >
        </div>
        <div id="lyric-container" class="w-full hidden">
          <div id="lyric-line" class="lyric-line"></div>
        </div>
      </div>

      <nav class="controls">
        <button id="btn-prev" class="btn btn--icon">⏮</button>
        <button id="btn-toggle" class="btn" style="min-width: 120px">
          ⏯ 播放
        </button>
        <button id="btn-reveal" class="btn btn--primary btn--disabled">
          ✨ 答對
        </button>
        <button id="btn-reset" class="btn">🔄 重來</button>
        <button id="btn-next" class="btn btn--icon">⏭</button>
        <button
          id="btn-exit"
          class="btn btn--icon"
          style="
            margin-left: 20px;
            color: var(--c-danger);
            border-color: var(--c-danger);
          "
        >
          🏠
        </button>
      </nav>
    </div>

    <script>
      // --- 引入 Electron 的模組 ---
      const fs = require("fs");
      const path = require("path");

      const RoundState = {
        IDLE: "IDLE",
        FLOW: "FLOW",
        LOCKED: "LOCKED",
        REVEALING: "REVEALING",
        FINISHED: "FINISHED",
      };

      let state = {
        playlist: [],
        currentTrackIndex: 0,
        roundState: RoundState.IDLE,
        currentIndex: -1,
        lyricsData: [],
        config: { startTime: 0, endTime: 0 },
        isTitleVisible: false,
        isPlaying: false,
      };

      let syncTimer = null;

      const els = {
        screens: {
          start: document.getElementById("screen-start"),
          game: document.getElementById("screen-game"),
        },
        audio: document.getElementById("audioPlayer"),
        status: document.getElementById("load-status"),
        displays: {
          round: document.getElementById("display-round"),
          status: document.getElementById("display-status"),
          title: document.getElementById("display-title"),
          idleMsg: document.getElementById("idle-msg"),
          idleRound: document.getElementById("idle-round-text"),
          lyricContainer: document.getElementById("lyric-container"),
          lyricLine: document.getElementById("lyric-line"),
          menu: document.getElementById("menu-container"),
          visualizer: document.getElementById("visualizer"),
        },
        btns: {
          start: document.getElementById("btn-start-game"),
          reload: document.getElementById("btn-reload"),
          prev: document.getElementById("btn-prev"),
          next: document.getElementById("btn-next"),
          toggle: document.getElementById("btn-toggle"),
          reveal: document.getElementById("btn-reveal"),
          reset: document.getElementById("btn-reset"),
          exit: document.getElementById("btn-exit"),
        },
      };

      // --- 核心修改：讀取 JSON 檔案 ---
      function loadPlaylistFromFile() {
        // 檔案路徑：跟 index.html 在同一層的 playlist.json
        const jsonPath = path.join(__dirname, "playlist.json");

        els.status.textContent = "正在讀取 playlist.json ...";
        els.status.className = ""; // 清除錯誤樣式
        els.btns.start.classList.add("btn--disabled");

        if (fs.existsSync(jsonPath)) {
          try {
            const data = fs.readFileSync(jsonPath, "utf-8");
            const pl = JSON.parse(data);

            if (Array.isArray(pl) && pl.length > 0) {
              state.playlist = pl;
              els.status.textContent = `✅ 成功載入 ${pl.length} 首歌曲`;
              els.status.style.color = "#4c4";
              els.btns.start.classList.remove("btn--disabled");
            } else {
              throw new Error("格式錯誤：必須是包含歌曲的陣列");
            }
          } catch (e) {
            els.status.textContent = "❌ 讀取失敗: " + e.message;
            els.status.className = "error-msg";
          }
        } else {
          els.status.textContent =
            "⚠️ 找不到檔案：請在同一資料夾建立 playlist.json";
          els.status.className = "error-msg";
        }
      }

      function init() {
        loadPlaylistFromFile();
        bindEvents();
      }

      function bindEvents() {
        // 重新讀取按鈕
        els.btns.reload.addEventListener("click", () => {
          loadPlaylistFromFile();
        });

        els.btns.start.addEventListener("click", () => {
          if (state.playlist.length > 0) {
            switchScreen("game");
            loadSong(0);
          }
        });
        els.btns.exit.addEventListener("click", () => {
          stopSync();
          els.audio.pause();
          switchScreen("start");
        });

        els.btns.toggle.addEventListener("click", togglePlay);
        els.btns.reveal.addEventListener("click", reveal);
        els.btns.reset.addEventListener("click", () =>
          loadSong(state.currentTrackIndex)
        );
        els.btns.prev.addEventListener("click", () =>
          loadSong(state.currentTrackIndex - 1)
        );
        els.btns.next.addEventListener("click", () =>
          loadSong(state.currentTrackIndex + 1)
        );

        els.displays.round.addEventListener("click", (e) => {
          e.stopPropagation();
          els.displays.menu.classList.toggle("visible");
        });
        document.addEventListener("click", () =>
          els.displays.menu.classList.remove("visible")
        );

        window.addEventListener("keydown", (e) => {
          if (!els.screens.game.classList.contains("hidden")) {
            if (e.code === "Space") {
              e.preventDefault();
              togglePlay();
            }
            if (e.code === "Enter") {
              e.preventDefault();
              reveal();
            }
            if (e.code === "KeyR") loadSong(state.currentTrackIndex);
            if (e.code === "ArrowRight") loadSong(state.currentTrackIndex + 1);
            if (e.code === "ArrowLeft") loadSong(state.currentTrackIndex - 1);
          }
        });

        els.audio.addEventListener("play", () => {
          state.isPlaying = true;
          if (state.roundState === RoundState.IDLE)
            state.roundState = RoundState.FLOW;
          startSync();
          updateUI();
        });
        els.audio.addEventListener("pause", () => {
          state.isPlaying = false;
          stopSync();
          updateUI();
        });
        els.audio.addEventListener("ended", () => {
          state.isPlaying = false;
          state.roundState = RoundState.FINISHED;
          stopSync();
          updateUI();
        });
        els.audio.addEventListener("error", (e) => {
          console.error("Audio Error", e);
          alert("音訊載入失敗：請檢查 songs 資料夾與檔名");
        });
      }

      function switchScreen(screenName) {
        Object.values(els.screens).forEach((el) => el.classList.add("hidden"));
        els.screens[screenName].classList.remove("hidden");
      }

      window.loadSong = function (index) {
        if (index < 0 || index >= state.playlist.length) return;
        state.currentTrackIndex = index;
        const song = state.playlist[index];

        // 路徑處理
        let songUrl = song.url;
        if (!songUrl && song.filename) songUrl = "./songs/" + song.filename;

        state.config = {
          startTime: song.startTime || 0,
          endTime: song.endTime || 0,
        };
        state.lyricsData = parseLRC(song.lrc);
        state.roundState = RoundState.IDLE;
        state.currentIndex = -1;
        state.isTitleVisible = false;
        stopSync();
        els.audio.src = songUrl;
        els.audio.currentTime = state.config.startTime;
        els.audio.load();
        buildMenu();
        updateUI();
      };

      function togglePlay() {
        if (
          state.roundState === RoundState.LOCKED ||
          state.roundState === RoundState.REVEALING
        )
          return;
        if (els.audio.paused) els.audio.play().catch(console.error);
        else els.audio.pause();
      }

      function startSync() {
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = setInterval(() => {
          if (state.roundState === RoundState.LOCKED || els.audio.paused)
            return;
          const t = els.audio.currentTime;
          if (state.config.endTime > 0 && t >= state.config.endTime) {
            els.audio.pause();
            state.roundState = RoundState.FINISHED;
            updateUI();
            return;
          }
          let activeIdx = -1;
          for (let i = 0; i < state.lyricsData.length; i++) {
            if (t >= state.lyricsData[i].time) activeIdx = i;
            else break;
          }
          if (activeIdx !== -1 && activeIdx !== state.currentIndex) {
            const target = state.lyricsData[activeIdx];
            if (target.hasMask && !target.isAnswered) {
              state.currentIndex = activeIdx;
              state.roundState = RoundState.LOCKED;
              els.audio.pause();
              updateUI();
              return;
            }
            state.currentIndex = activeIdx;
            updateUI();
          }
        }, 50);
      }

      function stopSync() {
        if (syncTimer) clearInterval(syncTimer);
      }

      function reveal() {
        if (state.roundState !== RoundState.LOCKED) return;
        state.lyricsData[state.currentIndex].isAnswered = true;
        state.roundState = RoundState.REVEALING;
        state.isTitleVisible = true;
        els.audio.play();
        updateUI();
        setTimeout(() => {
          if (state.roundState === RoundState.REVEALING) {
            state.roundState = RoundState.FLOW;
            updateUI();
          }
        }, 250);
      }

      function updateUI() {
        els.displays.round.textContent = `ROUND ${state.currentTrackIndex + 1}`;
        els.displays.status.textContent =
          state.roundState === RoundState.LOCKED
            ? "Waiting..."
            : state.roundState === RoundState.REVEALING
              ? "Correct!"
              : state.roundState === RoundState.FINISHED
                ? "Finished"
                : state.roundState === RoundState.IDLE
                  ? "Ready"
                  : "";

        els.displays.title.textContent =
          state.playlist[state.currentTrackIndex]?.title || "";
        if (state.isTitleVisible) els.displays.title.classList.add("visible");
        else els.displays.title.classList.remove("visible");

        if (state.isPlaying || state.roundState === RoundState.LOCKED)
          els.displays.visualizer.classList.add("active");
        else els.displays.visualizer.classList.remove("active");
        if (state.isPlaying) els.displays.visualizer.classList.add("playing");
        else els.displays.visualizer.classList.remove("playing");

        if (state.roundState === RoundState.IDLE) {
          els.displays.idleMsg.classList.remove("hidden");
          els.displays.lyricContainer.classList.add("hidden");
          els.displays.idleRound.textContent = `ROUND ${state.currentTrackIndex + 1}`;
        } else {
          els.displays.idleMsg.classList.add("hidden");
          els.displays.lyricContainer.classList.remove("hidden");
        }

        if (state.currentIndex !== -1 && state.lyricsData[state.currentIndex]) {
          const line = state.lyricsData[state.currentIndex];
          let html = line.rawText;
          if (line.hasMask) {
            html = html.replace(/\*(.*?)\*/g, (match, answerContent) => {
              const content = line.isAnswered
                ? answerContent
                : "＊".repeat(answerContent.length);
              let stateClass =
                line.isAnswered && state.roundState === RoundState.REVEALING
                  ? "is-revealing"
                  : "";
              return `<span class="magic-word ${stateClass}">${content}</span>`;
            });
          }
          els.displays.lyricLine.innerHTML = html;
        } else {
          els.displays.lyricLine.innerHTML = "";
        }

        els.btns.toggle.textContent = state.isPlaying ? "⏸ 暫停" : "⏯ 播放";
        if (state.roundState === RoundState.LOCKED)
          els.btns.reveal.classList.remove("btn--disabled");
        else els.btns.reveal.classList.add("btn--disabled");
      }

      function buildMenu() {
        let html = "";
        state.playlist.forEach((song, idx) => {
          const active = idx === state.currentTrackIndex ? "active" : "";
          html += `<div class="menu__item ${active}" onclick="loadSong(${idx})">Round ${idx + 1}</div>`;
        });
        els.displays.menu.innerHTML = html;
      }

      function parseLRC(lrc) {
        if (!lrc) return [];
        let lines = Array.isArray(lrc) ? lrc : lrc.split("\n");
        return lines
          .map((line) => {
            const match = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/.exec(line);
            if (!match) return null;
            const time =
              parseInt(match[1]) * 60 +
              parseInt(match[2]) +
              parseInt(match[3].padEnd(3, "0")) / 1000;
            const rawText = line.replace(/\[.*?\]/, "").trim();
            return {
              time,
              rawText,
              hasMask: rawText.includes("*"),
              isAnswered: false,
            };
          })
          .filter((x) => x)
          .sort((a, b) => a.time - b.time);
      }

      init();
    </script>
  </body>
</html>

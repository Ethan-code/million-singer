<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>百萬大歌星 (標題滑入版)</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;"
    />

    <style>
      /* --- 全局設定 --- */
      :root {
        --c-gold: #ffcc00;
        --c-bg: #000;
        --c-panel: #222;
        --c-text: #fff;
        --c-border: #444;
        --c-danger: #c00;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--c-bg);
        color: var(--c-text);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        position: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .hidden {
        display: none !important;
      }

      /* --- 面板 --- */
      .panel {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .panel__title {
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 900;
        color: var(--c-gold);
        margin: 0 0 20px 0;
      }

      .btn {
        padding: 12px 20px;
        border-radius: 50px;
        font-weight: bold;
        cursor: pointer;
        border: 1px solid var(--c-border);
        background: var(--c-panel);
        color: #aaa;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        white-space: nowrap;
        font-size: 0.9rem;
      }
      .btn:hover {
        background: #444;
        color: #fff;
        transform: translateY(-2px);
      }
      .btn--primary {
        background: var(--c-gold);
        color: black;
        border: none;
        box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
      }
      .btn--disabled {
        opacity: 0.3;
        pointer-events: none;
        filter: grayscale(1);
      }
      .btn--icon {
        width: 48px;
        padding: 0;
      }

      /* --- 題庫列表 --- */
      .playlist-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 300px;
        overflow-y: auto;
        width: 100%;
        max-width: 400px;
        margin-bottom: 30px;
        border: 1px solid #333;
        padding: 10px;
        border-radius: 8px;
        background: #111;
        scroll-behavior: smooth;
      }
      .playlist-item {
        padding: 15px;
        border: 1px solid #444;
        border-radius: 4px;
        cursor: pointer;
        color: #ccc;
        transition: all 0.2s;
        text-align: center;
      }
      .playlist-item:hover {
        border-color: var(--c-gold);
        color: white;
        background: #222;
      }
      .playlist-item.selected {
        background: var(--c-gold);
        color: black;
        font-weight: bold;
        border-color: var(--c-gold);
        box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
      }

      /* --- 遊戲畫面 --- */
      .game {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* 1. Header (包含 Visualizer) */
      .header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100px;
        display: grid;
        grid-template-columns: 200px 1fr 200px; /* 左中右佈局 */
        align-items: center;
        padding: 0 40px;
        z-index: 50;
        pointer-events: none;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
      }

      .header__round {
        font-size: 1.5rem;
        color: var(--c-gold);
        border: 2px solid var(--c-gold);
        padding: 5px 20px;
        border-radius: 50px;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.5);
        pointer-events: auto;
        text-align: center;
      }

      .header__status {
        font-size: 1.2rem;
        color: #888;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: right;
      }

      /* 2. Visualizer (在 Header 中間) */
      .visualizer {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        height: 40px;
        opacity: 0.2;
        transition: opacity 0.5s;
      }
      .visualizer.active {
        opacity: 1;
      }
      .visualizer__bar {
        width: 8px;
        background: var(--c-gold);
        border-radius: 2px;
        box-shadow: 0 0 10px var(--c-gold);
        height: 100%;
      }
      .visualizer.playing .visualizer__bar {
        animation: bounce 1s infinite ease-in-out;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: scaleY(0.3);
          opacity: 0.5;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      /* 3. 右側標題滑出區塊 (Title Panel) - 這裡套用了之前的 Answer Panel 效果 */
      .title-panel {
        position: fixed;
        right: 0;
        bottom: 150px; /* 位於控制列上方 */
        background: rgba(0, 0, 0, 0.9);
        border: 4px solid var(--c-gold);
        border-right: none;
        border-radius: 20px 0 0 20px;
        padding: 15px 40px;
        padding-right: 60px;
        color: #fff;
        box-shadow: -10px 10px 50px rgba(0, 0, 0, 0.8);
        transform: translateX(120%); /* 預設藏在外面 */
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 300px;
      }
      /* 滑入狀態 */
      .title-panel.visible {
        transform: translateX(0);
      }

      .title-label {
        font-size: 0.9rem;
        color: var(--c-gold);
        font-weight: bold;
        margin-bottom: 5px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .title-text {
        font-size: 2rem;
        font-weight: 900;
        color: white;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        white-space: nowrap;
      }

      /* 全螢幕歌詞 */
      .lyrics-area {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 30;
        overflow: visible;
      }
      .lyric-line {
        font-size: 20vmin;
        font-weight: 900;
        line-height: 1;
        color: white;
        text-shadow: 0 0 60px rgba(255, 204, 0, 0.8);
        white-space: pre-wrap;
        word-break: break-word;
        padding: 0 20px;
        text-align: center;
        width: 100%;
      }
      @media (min-width: 1024px) {
        .lyric-line {
          font-size: 32vh;
        }
      }

      /* 4. 恢復原本的 ＊ 遮罩效果 */
      .magic-word {
        display: inline-block;
        color: var(--c-gold);
        text-shadow: 0 0 40px rgba(255, 204, 0, 0.8);
        margin: 0 5px;
        letter-spacing: 0px;
        border-bottom: 0.1em solid var(--c-gold);
        padding-bottom: 10px;
        vertical-align: baseline;
      }
      .magic-word.is-revealing {
        animation: popText 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      @keyframes popText {
        0% {
          transform: scale(1);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.3);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* 中間過場大字 */
      #idle-round-text {
        color: var(--c-gold);
        white-space: nowrap;
        font-size: min(40vh, 18vw);
        font-weight: 900;
        margin: 0;
        line-height: 1;
        text-shadow: 0 0 80px rgba(255, 204, 0, 0.6);
        transform: skewX(-10deg);
      }

      .controls {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 40;
        padding: 20px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .controls:hover,
      .controls:active {
        opacity: 1;
      }
      .menu {
        position: absolute;
        top: 110px;
        left: 40px;
        background: rgba(34, 34, 34, 0.98);
        border: 2px solid var(--c-gold);
        border-radius: 8px;
        max-height: 50vh;
        overflow-y: auto;
        z-index: 101;
        display: none;
        min-width: 250px;
      }
      .menu.visible {
        display: block;
      }
      .menu__item {
        padding: 15px 25px;
        cursor: pointer;
        border-bottom: 1px solid #444;
        color: #ccc;
        font-size: 1.2rem;
      }
      .menu__item:hover,
      .menu__item.active {
        background: var(--c-gold);
        color: black;
        font-weight: bold;
      }

      .error-msg {
        color: #f55;
        margin-top: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <audio id="audioPlayer" preload="auto" style="display: none"></audio>

    <section id="screen-start" class="panel">
      <h1 class="panel__title">🎤 百萬大歌星</h1>
      <p style="color: #aaa; margin-bottom: 10px">請選擇題庫 (使用 ↑ ↓ 鍵)</p>
      <div id="playlist-container" class="playlist-list">
        <div style="color: #666; text-align: center">正在掃描題庫...</div>
      </div>
      <div style="display: flex; gap: 10px">
        <button
          id="btn-start-game"
          class="btn btn--primary btn--disabled"
          style="font-size: 1.5rem"
        >
          開始遊戲 (Enter)
        </button>
        <button id="btn-refresh" class="btn">🔄 重新掃描 (R)</button>
      </div>
      <p id="load-status" class="error-msg"></p>
    </section>

    <div id="screen-game" class="game hidden">
      <header class="header">
        <div id="display-round" class="header__round">ROUND 1</div>
        <div id="visualizer" class="visualizer">
          <div
            class="visualizer__bar"
            style="height: 40%; animation-duration: 0.8s"
          ></div>
          <div
            class="visualizer__bar"
            style="height: 80%; animation-duration: 1.2s"
          ></div>
          <div
            class="visualizer__bar"
            style="height: 60%; animation-duration: 0.5s"
          ></div>
          <div
            class="visualizer__bar"
            style="height: 90%; animation-duration: 1s"
          ></div>
          <div
            class="visualizer__bar"
            style="height: 50%; animation-duration: 0.7s"
          ></div>
          <div
            class="visualizer__bar"
            style="height: 70%; animation-duration: 0.9s"
          ></div>
          <div
            class="visualizer__bar"
            style="height: 40%; animation-duration: 1.1s"
          ></div>
        </div>
        <div id="display-status" class="header__status">Ready</div>
      </header>

      <aside id="menu-container" class="menu"></aside>

      <div id="title-panel" class="title-panel">
        <div class="title-label">Now Playing</div>
        <div id="title-text" class="title-text"></div>
      </div>

      <div class="lyrics-area">
        <div
          id="idle-msg"
          style="display: flex; flex-direction: column; align-items: center"
        >
          <p id="idle-round-text"></p>
        </div>
        <div id="lyric-container" class="w-full hidden">
          <div id="lyric-line" class="lyric-line"></div>
        </div>
      </div>

      <nav class="controls">
        <button id="btn-prev" class="btn btn--icon">⏮</button>
        <button id="btn-toggle" class="btn" style="min-width: 140px">
          ⏯ 播放 (Space)
        </button>
        <button id="btn-reveal" class="btn btn--primary btn--disabled">
          ✨ 答對 (Enter)
        </button>
        <button id="btn-reset" class="btn">🔄 重來 (R)</button>
        <button id="btn-next" class="btn btn--icon">⏭</button>
        <button
          id="btn-exit"
          class="btn"
          style="
            margin-left: 20px;
            color: var(--c-danger);
            border-color: var(--c-danger);
          "
        >
          🏠 (H)
        </button>
      </nav>
    </div>

    <script>
      const fs = require("fs");
      const path = require("path");

      const RoundState = {
        IDLE: "IDLE",
        FLOW: "FLOW",
        LOCKED: "LOCKED",
        REVEALING: "REVEALING",
        FINISHED: "FINISHED",
      };

      let state = {
        playlist: [],
        currentTrackIndex: 0,
        roundState: RoundState.IDLE,
        currentIndex: -1,
        lyricsData: [],
        config: { startTime: 0, endTime: 0 },
        isTitleVisible: false,
        isPlaying: false,
        selectedFile: null,
        availableFiles: [],
        selectionIndex: -1,
      };

      let syncTimer = null;

      const els = {
        screens: {
          start: document.getElementById("screen-start"),
          game: document.getElementById("screen-game"),
        },
        audio: document.getElementById("audioPlayer"),
        status: document.getElementById("load-status"),
        playlistList: document.getElementById("playlist-container"),
        titlePanel: document.getElementById("title-panel"),
        titleText: document.getElementById("title-text"),
        displays: {
          round: document.getElementById("display-round"),
          status: document.getElementById("display-status"),
          idleMsg: document.getElementById("idle-msg"),
          idleRound: document.getElementById("idle-round-text"),
          lyricContainer: document.getElementById("lyric-container"),
          lyricLine: document.getElementById("lyric-line"),
          menu: document.getElementById("menu-container"),
          visualizer: document.getElementById("visualizer"),
        },
        btns: {
          start: document.getElementById("btn-start-game"),
          refresh: document.getElementById("btn-refresh"),
          prev: document.getElementById("btn-prev"),
          next: document.getElementById("btn-next"),
          toggle: document.getElementById("btn-toggle"),
          reveal: document.getElementById("btn-reveal"),
          reset: document.getElementById("btn-reset"),
          exit: document.getElementById("btn-exit"),
        },
      };

      function scanPlaylists() {
        const playlistDir = path.join(__dirname, "playlists");
        els.playlistList.innerHTML = "";
        els.status.textContent = "";
        state.selectedFile = null;
        state.availableFiles = [];
        state.selectionIndex = -1;
        els.btns.start.classList.add("btn--disabled");

        if (!fs.existsSync(playlistDir)) {
          try {
            fs.mkdirSync(playlistDir);
            els.playlistList.innerHTML =
              '<div style="color:#f55; padding:10px; text-align:center;">找不到 playlists 資料夾，已為您自動建立。</div>';
          } catch (e) {
            els.status.textContent = "無法建立資料夾：" + e.message;
          }
          return;
        }

        try {
          const files = fs
            .readdirSync(playlistDir)
            .filter((file) => file.endsWith(".json"));
          if (files.length === 0) {
            els.playlistList.innerHTML =
              '<div style="color:#888; padding:10px; text-align:center;">資料夾是空的 (需放入 .json)</div>';
            return;
          }
          state.availableFiles = files;
          files.forEach((file, index) => {
            const div = document.createElement("div");
            div.className = "playlist-item";
            div.textContent = file.replace(".json", "");
            div.onclick = () => selectPlaylistByIndex(index);
            els.playlistList.appendChild(div);
          });
        } catch (e) {
          els.status.textContent = "掃描失敗：" + e.message;
        }
      }

      function selectPlaylistByIndex(index) {
        if (index < 0 || index >= state.availableFiles.length) return;
        state.selectionIndex = index;
        state.selectedFile = state.availableFiles[index];
        const items = els.playlistList.children;
        for (let i = 0; i < items.length; i++) {
          if (i === index) items[i].classList.add("selected");
          else items[i].classList.remove("selected");
        }
        items[index].scrollIntoView({ block: "nearest", behavior: "smooth" });
        els.btns.start.classList.remove("btn--disabled");
      }

      function loadSelectedPlaylist() {
        if (!state.selectedFile) return;
        const filePath = path.join(__dirname, "playlists", state.selectedFile);
        try {
          const data = fs.readFileSync(filePath, "utf-8");
          const pl = JSON.parse(data);
          if (Array.isArray(pl) && pl.length > 0) {
            state.playlist = pl;
            switchScreen("game");
            loadSong(0);
          } else {
            throw new Error("格式錯誤：必須是包含歌曲的陣列");
          }
        } catch (e) {
          alert("讀取題庫失敗: " + e.message);
        }
      }

      function init() {
        scanPlaylists();
        bindEvents();
      }

      function bindEvents() {
        els.btns.refresh.addEventListener("click", scanPlaylists);
        els.btns.start.addEventListener("click", loadSelectedPlaylist);
        els.btns.exit.addEventListener("click", () => {
          stopSync();
          els.audio.pause();
          switchScreen("start");
        });

        els.btns.toggle.addEventListener("click", togglePlay);
        els.btns.reveal.addEventListener("click", reveal);
        els.btns.reset.addEventListener("click", () =>
          loadSong(state.currentTrackIndex)
        );
        els.btns.prev.addEventListener("click", () =>
          loadSong(state.currentTrackIndex - 1)
        );
        els.btns.next.addEventListener("click", () =>
          loadSong(state.currentTrackIndex + 1)
        );

        els.displays.round.addEventListener("click", (e) => {
          e.stopPropagation();
          els.displays.menu.classList.toggle("visible");
        });
        document.addEventListener("click", () =>
          els.displays.menu.classList.remove("visible")
        );

        window.addEventListener("keydown", (e) => {
          if (!els.screens.start.classList.contains("hidden")) {
            switch (e.code) {
              case "Enter":
                if (state.selectedFile) {
                  e.preventDefault();
                  loadSelectedPlaylist();
                }
                break;
              case "KeyR":
                e.preventDefault();
                scanPlaylists();
                break;
              case "ArrowDown":
                e.preventDefault();
                if (state.availableFiles.length > 0) {
                  let i = state.selectionIndex + 1;
                  if (i >= state.availableFiles.length)
                    i = state.availableFiles.length - 1;
                  selectPlaylistByIndex(i);
                }
                break;
              case "ArrowUp":
                e.preventDefault();
                if (state.availableFiles.length > 0) {
                  let i = state.selectionIndex - 1;
                  if (i < 0) i = 0;
                  selectPlaylistByIndex(i);
                }
                break;
            }
          } else if (!els.screens.game.classList.contains("hidden")) {
            switch (e.code) {
              case "Space":
                e.preventDefault();
                togglePlay();
                break;
              case "Enter":
                e.preventDefault();
                reveal();
                break;
              case "KeyR":
                loadSong(state.currentTrackIndex);
                break;
              case "ArrowRight":
                loadSong(state.currentTrackIndex + 1);
                break;
              case "ArrowLeft":
                loadSong(state.currentTrackIndex - 1);
                break;
              case "KeyH":
                stopSync();
                els.audio.pause();
                switchScreen("start");
                break;
            }
          }
        });

        els.audio.addEventListener("play", () => {
          state.isPlaying = true;
          if (state.roundState === RoundState.IDLE)
            state.roundState = RoundState.FLOW;
          startSync();
          updateUI();
        });
        els.audio.addEventListener("pause", () => {
          state.isPlaying = false;
          stopSync();
          updateUI();
        });
        els.audio.addEventListener("ended", () => {
          state.isPlaying = false;
          state.roundState = RoundState.FINISHED;
          stopSync();
          updateUI();
        });
        els.audio.addEventListener("error", (e) => {
          console.error("Audio Error", e);
          alert("音訊載入失敗");
        });
      }

      function switchScreen(screenName) {
        Object.values(els.screens).forEach((el) => el.classList.add("hidden"));
        els.screens[screenName].classList.remove("hidden");
      }

      window.loadSong = function (index) {
        if (index < 0 || index >= state.playlist.length) return;
        state.currentTrackIndex = index;
        const song = state.playlist[index];
        let songUrl = song.url;
        if (!songUrl && song.filename) songUrl = "./songs/" + song.filename;
        state.config = {
          startTime: song.startTime || 0,
          endTime: song.endTime || 0,
        };
        state.lyricsData = parseLRC(song.lrc);
        state.roundState = RoundState.IDLE;
        state.currentIndex = -1;
        state.isTitleVisible = false;
        stopSync();
        els.audio.src = songUrl;
        els.audio.currentTime = state.config.startTime;
        els.audio.load();
        buildMenu();
        updateUI();
      };

      function togglePlay() {
        if (
          state.roundState === RoundState.LOCKED ||
          state.roundState === RoundState.REVEALING
        )
          return;
        if (els.audio.paused) els.audio.play().catch(console.error);
        else els.audio.pause();
      }

      function startSync() {
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = setInterval(() => {
          if (state.roundState === RoundState.LOCKED || els.audio.paused)
            return;
          const t = els.audio.currentTime;
          if (state.config.endTime > 0 && t >= state.config.endTime) {
            els.audio.pause();
            state.roundState = RoundState.FINISHED;
            updateUI();
            return;
          }
          let activeIdx = -1;
          for (let i = 0; i < state.lyricsData.length; i++) {
            if (t >= state.lyricsData[i].time) activeIdx = i;
            else break;
          }
          if (activeIdx !== -1 && activeIdx !== state.currentIndex) {
            const target = state.lyricsData[activeIdx];
            if (target.hasMask && !target.isAnswered) {
              state.currentIndex = activeIdx;
              state.roundState = RoundState.LOCKED;
              els.audio.pause();
              updateUI();
              return;
            }
            state.currentIndex = activeIdx;
            updateUI();
          }
        }, 50);
      }

      function stopSync() {
        if (syncTimer) clearInterval(syncTimer);
      }

      function reveal() {
        if (state.roundState !== RoundState.LOCKED) return;
        state.lyricsData[state.currentIndex].isAnswered = true;
        state.roundState = RoundState.REVEALING;
        state.isTitleVisible = true;
        els.audio.play();
        updateUI();
        setTimeout(() => {
          if (state.roundState === RoundState.REVEALING) {
            state.roundState = RoundState.FLOW;
            updateUI();
          }
        }, 250);
      }

      function updateUI() {
        els.displays.round.textContent = `ROUND ${state.currentTrackIndex + 1}`;
        els.displays.status.textContent =
          state.roundState === RoundState.LOCKED
            ? "Waiting..."
            : state.roundState === RoundState.REVEALING
              ? "Correct!"
              : state.roundState === RoundState.FINISHED
                ? "Finished"
                : state.roundState === RoundState.IDLE
                  ? "Ready"
                  : "";

        // --- 控制標題滑入面板 ---
        els.titleText.textContent =
          state.playlist[state.currentTrackIndex]?.title || "";
        if (state.isTitleVisible) {
          els.titlePanel.classList.add("visible");
        } else {
          els.titlePanel.classList.remove("visible");
        }

        if (state.isPlaying || state.roundState === RoundState.LOCKED)
          els.displays.visualizer.classList.add("active");
        else els.displays.visualizer.classList.remove("active");
        if (state.isPlaying) els.displays.visualizer.classList.add("playing");
        else els.displays.visualizer.classList.remove("playing");

        if (state.roundState === RoundState.IDLE) {
          els.displays.idleMsg.classList.remove("hidden");
          els.displays.lyricContainer.classList.add("hidden");
          els.displays.idleRound.textContent = `ROUND ${state.currentTrackIndex + 1}`;
          els.titlePanel.classList.remove("visible"); // 閒置時隱藏標題
        } else {
          els.displays.idleMsg.classList.add("hidden");
          els.displays.lyricContainer.classList.remove("hidden");
        }

        if (state.currentIndex !== -1 && state.lyricsData[state.currentIndex]) {
          const line = state.lyricsData[state.currentIndex];
          let html = line.rawText;

          // 改回原來的 inline ＊ 揭曉
          if (line.hasMask) {
            html = html.replace(/\*(.*?)\*/g, (match, answerContent) => {
              // 如果已揭曉：顯示文字；如果未揭曉：顯示 ＊＊＊
              const content = line.isAnswered
                ? answerContent
                : "＊".repeat(answerContent.length);
              let stateClass =
                line.isAnswered && state.roundState === RoundState.REVEALING
                  ? "is-revealing"
                  : "";
              return `<span class="magic-word ${stateClass}">${content}</span>`;
            });
          }
          els.displays.lyricLine.innerHTML = html;
        } else {
          els.displays.lyricLine.innerHTML = "";
        }

        els.btns.toggle.textContent = state.isPlaying
          ? "⏸ 暫停 (Space)"
          : "⏯ 播放 (Space)";
        if (state.roundState === RoundState.LOCKED)
          els.btns.reveal.classList.remove("btn--disabled");
        else els.btns.reveal.classList.add("btn--disabled");
      }

      function buildMenu() {
        let html = "";
        state.playlist.forEach((song, idx) => {
          const active = idx === state.currentTrackIndex ? "active" : "";
          html += `<div class="menu__item ${active}" onclick="loadSong(${idx})">Round ${idx + 1}</div>`;
        });
        els.displays.menu.innerHTML = html;
      }

      function parseLRC(lrc) {
        if (!lrc) return [];
        let lines = Array.isArray(lrc) ? lrc : lrc.split("\n");
        return lines
          .map((line) => {
            const match = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/.exec(line);
            if (!match) return null;
            const time =
              parseInt(match[1]) * 60 +
              parseInt(match[2]) +
              parseInt(match[3].padEnd(3, "0")) / 1000;
            const rawText = line.replace(/\[.*?\]/, "").trim();
            return {
              time,
              rawText,
              hasMask: rawText.includes("*"),
              isAnswered: false,
            };
          })
          .filter((x) => x)
          .sort((a, b) => a.time - b.time);
      }

      init();
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>百萬大歌星</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;"
    />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <audio id="audioPlayer" preload="auto" style="display: none"></audio>

    <section id="screen-start" class="panel">
      <h1 class="panel__title">🎤 百萬大歌星</h1>
      <p class="panel__hint">請選擇題庫 (使用 ↑ ↓ 鍵)</p>
      <div id="playlist-container" class="playlist-list">
        <div class="playlist-list__msg">正在掃描題庫...</div>
      </div>
      <div class="panel__actions">
        <button
          id="btn-start-game"
          class="btn btn--primary btn--large btn--disabled"
        >
          開始遊戲 (Enter)
        </button>
        <button id="btn-refresh" class="btn">🔄 重新掃描 (R)</button>
      </div>
      <ul id="check-list" class="check-list hidden"></ul>
      <p id="load-status" class="error-msg"></p>
      <div class="data-dir">
        <span>📁 資料夾</span>
        <span id="data-dir-path" class="data-dir__path"></span>
        <button id="btn-open-dir" class="btn btn--small">開啟</button>
        <button id="btn-change-dir" class="btn btn--small">變更</button>
      </div>
    </section>

    <div id="screen-game" class="game hidden">
      <div id="warning-overlay" class="warning-overlay"></div>

      <div id="warning-icon" class="warning-icon">⚠️</div>

      <header class="header">
        <div id="display-round" class="header__round">ROUND 1</div>
        <div id="visualizer" class="visualizer">
          <div
            class="visualizer__bar"
            style="height: 40%; animation-duration: 0.8s"
          ></div>
          <div
            class="visualizer__bar"
            style="height: 80%; animation-duration: 1.2s"
          ></div>
          <div
            class="visualizer__bar"
            style="height: 60%; animation-duration: 0.5s"
          ></div>
          <div
            class="visualizer__bar"
            style="height: 90%; animation-duration: 1s"
          ></div>
          <div
            class="visualizer__bar"
            style="height: 50%; animation-duration: 0.7s"
          ></div>
          <div
            class="visualizer__bar"
            style="height: 70%; animation-duration: 0.9s"
          ></div>
          <div
            class="visualizer__bar"
            style="height: 40%; animation-duration: 1.1s"
          ></div>
        </div>
        <div id="display-status" class="header__status">Ready</div>
      </header>

      <aside id="menu-container" class="menu"></aside>

      <div id="title-panel" class="title-panel">
        <div class="title-label">Now Playing</div>
        <div id="title-text" class="title-text"></div>
      </div>

      <div class="lyrics-area">
        <div id="idle-msg" class="idle-msg">
          <p id="idle-round-text"></p>
        </div>
        <div id="lyric-container" class="hidden">
          <div id="lyric-line" class="lyric-line"></div>
        </div>
      </div>

      <nav class="controls">
        <button id="btn-prev" class="btn btn--icon">⏮</button>
        <button id="btn-toggle" class="btn" style="min-width: 140px">
          ▶ 開始 (Space)
        </button>
        <button id="btn-reveal" class="btn btn--primary btn--disabled">
          ✨ 答對 (Enter)
        </button>
        <button id="btn-answer" class="btn btn--disabled">📖 答案 (A)</button>
        <button id="btn-reset" class="btn">🔄 重來 (R)</button>
        <button id="btn-next" class="btn btn--icon">⏭</button>
        <button id="btn-exit" class="btn btn--danger">🏠 (H)</button>
      </nav>
    </div>

    <script src="src/renderer.js"></script>
  </body>
</html>

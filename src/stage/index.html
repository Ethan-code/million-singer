<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>百萬大歌星</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: file:; frame-src http://127.0.0.1:*; media-src * file: blob: data:;"
    />
    <link rel="stylesheet" href="../ui/base.css" />
    <link rel="stylesheet" href="stage.css" />
  </head>
  <body>
    <!-- 3D 背景（scene3d.js） -->
    <canvas id="scene" class="scene"></canvas>
    <div class="vignette"></div>

    <div id="waiting" class="waiting">
      <div class="logo">
        <span class="logo__mic">🎤</span>
        <span class="logo__text">百萬大歌星</span>
      </div>
      <p class="waiting__hint">等待控制台開始遊戲…</p>
    </div>

    <div id="game" class="game hidden">
      <div id="warning-overlay" class="warning-overlay"></div>
      <div id="flash" class="flash"></div>

      <header class="header">
        <div id="display-round" class="header__round">ROUND 1</div>
        <div id="visualizer" class="visualizer">
          <div class="visualizer__bar"></div>
          <div class="visualizer__bar"></div>
          <div class="visualizer__bar"></div>
          <div class="visualizer__bar"></div>
          <div class="visualizer__bar"></div>
          <div class="visualizer__bar"></div>
          <div class="visualizer__bar"></div>
          <div class="visualizer__bar"></div>
          <div class="visualizer__bar"></div>
        </div>
        <div id="display-status" class="header__status">READY</div>
      </header>

      <aside id="menu-container" class="menu"></aside>

      <div id="title-panel" class="title-panel">
        <div class="title-label">Now Playing</div>
        <div id="title-text" class="title-text"></div>
      </div>

      <main class="stage-main">
        <div id="video-box" class="video-box hidden"></div>
        <div class="lyrics-area">
          <div id="idle" class="idle">
            <div class="idle__label">ROUND</div>
            <div id="idle-round" class="idle__number">1</div>
            <div id="idle-sub" class="idle__sub"></div>
          </div>
          <div id="lyrics" class="lyrics hidden">
            <div id="lyric-line" class="lyric-line"></div>
          </div>
        </div>
      </main>

      <!-- 輪到誰接唱、這句值多少分 -->
      <div id="turn" class="turn hidden">
        <div id="turn-team" class="turn__team"></div>
        <div id="turn-points" class="turn__points"></div>
      </div>
      <div id="countdown" class="countdown hidden"></div>
      <div id="floats" class="floats"></div>

      <div id="scoreboard" class="scoreboard hidden"></div>

      <!-- 結算頒獎台 -->
      <div id="results" class="results hidden">
        <div class="results__title">🏆 最終結果</div>
        <div id="podium" class="podium"></div>
      </div>

      <nav class="controls">
        <button id="btn-prev" class="btn btn--icon">⏮</button>
        <button id="btn-toggle" class="btn" style="min-width: 110px">▶ 開始</button>
        <button id="btn-reveal" class="btn btn--primary btn--disabled">✨ 答對 (Enter)</button>
        <button id="btn-answer" class="btn btn--answer btn--disabled">📖 答案 (A)</button>
        <button id="btn-hint" class="btn btn--disabled">💡 提示 (I)</button>
        <button id="btn-replay" class="btn btn--disabled">⏪ 重聽 (B)</button>
        <button id="btn-skip" class="btn">⏩ 下一題 (N)</button>
        <button id="btn-reset" class="btn">🔄 (R)</button>
        <button id="btn-next" class="btn btn--icon">⏭</button>
        <button id="btn-exit" class="btn btn--danger">✖ (H)</button>
      </nav>
    </div>

    <script src="stage.js"></script>
  </body>
</html>
